[versions]
# ─── Build toolchain ────────────────────────────────────────────
# AGP 8.10.0 ships with Build Analyzer improvements + configuration-cache fixes
agp              = "8.10.0"
# Kotlin 2.1.21 matches the KSP release below and brings incremental-compile fixes
kotlin           = "2.1.21"
# KSP version MUST match kotlin version (format: <kotlin>-<ksp-patch>)
ksp              = "2.1.21-2.0.1"

# ─── AndroidX / Compose ─────────────────────────────────────────
# April 2025 BOM – latest stable, bundles Compose UI 1.7.x + Material3 1.3.x
composeBom              = "2025.04.01"
activityCompose         = "1.10.1"
# Navigation 2.8.x adds type-safe routes and better config-cache support
navigationCompose       = "2.8.9"
# Lifecycle 2.9.x – collectAsStateWithLifecycle API stabilised
lifecycleRuntime        = "2.9.0"
coreKtx                 = "1.16.0"

# ─── DI ─────────────────────────────────────────────────────────
hilt                    = "2.56.1"
hiltNavigationCompose   = "1.2.0"

# ─── Persistence ─────────────────────────────────────────────────
room                    = "2.7.1"
datastore               = "1.1.4"

# ─── Background work ────────────────────────────────────────────
workManager             = "2.10.1"

# ─── Async ──────────────────────────────────────────────────────
coroutines              = "1.9.0"

# ─── Image loading ──────────────────────────────────────────────
coil                    = "2.7.0"

# ─── Ads ────────────────────────────────────────────────────────
playServicesAds         = "23.6.0"

# ─── UI extras (kept because BOM does not manage these) ─────────
googleFonts             = "1.7.8"

[libraries]
# ─── AndroidX Core ──────────────────────────────────────────────
androidx-core-ktx                       = { group = "androidx.core",      name = "core-ktx",                        version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",           version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",       version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",     version.ref = "lifecycleRuntime" }
androidx-activity-compose               = { group = "androidx.activity",  name = "activity-compose",               version.ref = "activityCompose" }

# ─── Compose BOM (manages all compose-* versions) ───────────────
androidx-compose-bom                    = { group = "androidx.compose",              name = "compose-bom",              version.ref = "composeBom" }
androidx-compose-ui                     = { group = "androidx.compose.ui",           name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",           name = "ui-graphics" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",           name = "ui-tooling" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",           name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest       = { group = "androidx.compose.ui",           name = "ui-test-manifest" }
androidx-compose-material3              = { group = "androidx.compose.material3",    name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material",   name = "material-icons-extended" }
androidx-compose-animation              = { group = "androidx.compose.animation",    name = "animation" }
androidx-compose-foundation             = { group = "androidx.compose.foundation",   name = "foundation" }

# ─── Google Fonts (outside BOM – explicit version required) ─────
androidx-compose-google-fonts           = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "googleFonts" }

# ─── Navigation ─────────────────────────────────────────────────
androidx-navigation-compose             = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ─── Hilt DI ────────────────────────────────────────────────────
hilt-android                            = { group = "com.google.dagger",  name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler                   = { group = "com.google.dagger",  name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose        = { group = "androidx.hilt",      name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ─── Room ───────────────────────────────────────────────────────
androidx-room-runtime                   = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx                       = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler                  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ─── DataStore ──────────────────────────────────────────────────
androidx-datastore-preferences          = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ─── WorkManager ────────────────────────────────────────────────
androidx-work-runtime-ktx               = { group = "androidx.work",  name = "work-runtime-ktx", version.ref = "workManager" }
androidx-hilt-work                      = { group = "androidx.hilt",  name = "hilt-work",         version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler                  = { group = "androidx.hilt",  name = "hilt-compiler",     version.ref = "hiltNavigationCompose" }

# ─── Coroutines ─────────────────────────────────────────────────
kotlinx-coroutines-android              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ─── Coil ───────────────────────────────────────────────────────
coil-compose                            = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ─── Google Ads ─────────────────────────────────────────────────
play-services-ads                       = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
hilt-android        = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
